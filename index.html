<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Gestão de Limpeza · Web Summit Lisboa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300c2a8'/%3E%3Cpath d='M9 22l4-12h6l4 12' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">WS</div>
        <div>
          <div class="brand-title">Gestão de Limpeza</div>
          <div class="brand-sub" id="brand-sub">Web Summit · Lisboa</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-label">Operação</div>
        <a href="#painel" data-route="painel"><span class="ni">◧</span>Painel de controlo</a>
        <a href="#pavilhoes" data-route="pavilhoes"><span class="ni">▦</span>Pavilhões</a>
        <div class="nav-label">Serviços de limpeza</div>
        <a href="#abertura" data-route="abertura"><span class="ni dot" style="--c:#2563eb"></span>Limpeza de abertura</a>
        <a href="#noturna" data-route="noturna"><span class="ni dot" style="--c:#7c3aed"></span>Limpeza noturna</a>
        <a href="#dedicada" data-route="dedicada"><span class="ni dot" style="--c:#0891b2"></span>Apoio dedicado</a>
        <a href="#comum" data-route="comum"><span class="ni dot" style="--c:#059669"></span>Áreas comuns</a>
        <a href="#orcamento" data-route="orcamento"><span class="ni dot" style="--c:#d97706"></span>Orçamentos</a>
        <div class="nav-label">Gestão</div>
        <a href="#equipa" data-route="equipa"><span class="ni">☺</span>Equipa</a>
        <a href="#relatorios" data-route="relatorios"><span class="ni">▤</span>Relatórios e dados</a>
        <a href="#registo" data-route="registo"><span class="ni">≡</span>Registo de atividade</a>
        <a href="#definicoes" data-route="definicoes"><span class="ni">⚙</span>Definições</a>
      </nav>
      <div class="sync" id="sync"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-act="menu" aria-label="Menu">☰</button>
        <form class="search" id="search-form" role="search">
          <input id="search" type="search" placeholder="Pesquisar stand, empresa, código, contacto…" autocomplete="off">
        </form>
        <button class="user-chip" data-act="user" id="user-chip" title="Operador atual"></button>
        <button class="btn primary" data-act="new-svc">+ <span class="lbl-long">Novo pedido</span></button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="drawer-bg" class="overlay hidden" data-act="close-drawer"></div>
  <aside id="drawer" class="drawer hidden" aria-live="polite"></aside>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toasts"></div>
  <div id="print-area"></div>
  <input type="file" id="file-in" hidden>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
